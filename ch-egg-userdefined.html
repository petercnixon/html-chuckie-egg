		<Script type="text/JavaScript" language="JavaScript" src="config.js"></script>
		<script type="text/JavaScript">
			// The level editor's Play button lands here. Always take the layouts
			// it stored in the "levels" and "chars" cookies.
			g_loadLevels = true;

			// Play level adds ?level= so the game starts on that layout and
			// enemy set. The number is the same zero-based level the game uses.
			g_startLevel = 0;
			(function()
			{
				var search = window.location.search;
				if(!search || search.length < 2)
					return;
				var query = search.substring(1).split("&");
				for(var i = 0; i < query.length; ++i)
				{
					var pair = query[i].split("=");
					if(pair[0] != "level")
						continue;
					var n = parseInt(pair[1], 10);
					if(!isNaN(n) && n > 0)
						g_startLevel = n;
				}
			})();
		</script>

		<style type="text/css">
			/* The playfield is drawn at 320x256. Scale the finished board; sprite
			   positions and clip rectangles stay in the original pixel space. */
			#outerdiv {
				width: 320px;
				height: 256px;
				overflow: hidden;
				transform-origin: top left;
				transform: scale(var(--game-scale, 2));
				image-rendering: -moz-crisp-edges;
				image-rendering: pixelated;
			}
		</style>
		<script type="text/JavaScript">
			function fitGame()
			{
				var credit = document.getElementById("credit");
				var outer = document.getElementById("outerdiv");
				var creditBottom = credit.getBoundingClientRect().bottom;
				var availW = window.innerWidth;
				var availH = window.innerHeight - creditBottom;
				var scale = Math.floor(Math.min(availW / 320, availH / 256));
				if(scale < 1)
					scale = 1;
				document.documentElement.style.setProperty("--game-scale", scale);
				var left = Math.floor((availW - (320 * scale)) / 2);
				if(left < 0)
					left = 0;
				outer.style.marginLeft = left + "px";
			}
			window.addEventListener("resize", fitGame);
		</script>
	</head>
